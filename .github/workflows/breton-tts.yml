# Makes the Breton audio of an article with the breton-tts voice by
# Gweltaz Duval-Guennoc (https://huggingface.co/gweltou/breton-tts).
# Started by hand (or by Claude) with the text as base64 JSON. The text is
# never printed in the logs. The MP3 is saved on the "breton-audio" branch,
# from where Sanity fetches it and attaches it to the article.
name: Breton audio

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "Base64 JSON {parts: string[], speaker: 0|1} (empty = test sentence)"
        required: false
        default: ""
      name:
        description: "File name for the MP3, e.g. orin-an-amzao"
        required: false
        default: "test"

permissions:
  contents: write

jobs:
  speak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install --quiet sherpa-onnx numpy lameenc
          mkdir -p model
          curl -sSL -o model/model.onnx https://huggingface.co/gweltou/breton-tts/resolve/main/model.onnx
          curl -sSL -o model/tokens.txt https://huggingface.co/gweltou/breton-tts/resolve/main/tokens.txt
          ls -la model
          echo "Symbols in tokens.txt:"; cut -d' ' -f1 model/tokens.txt | tr '\n' ' '; echo
      - name: Read the text
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: |
          if [ -n "$PAYLOAD" ]; then
            echo "$PAYLOAD" | base64 -d > input.json
          else
            echo '{"parts":["Demat d'"'"'an holl! Hemañ eo eur skouer evid selaou ar vouez.","Keleier Breiz hag ar Bed, euz 1805 betek 1919."],"speaker":0}' > input.json
          fi
      - name: Speak
        run: python scripts/tts/speak.py input.json out.mp3
      - name: Save the MP3 on the breton-audio branch
        env:
          NAME: ${{ inputs.name }}
        run: |
          FILE="$(echo "$NAME" | tr -cd 'a-z0-9-')-$(date +%Y%m%d%H%M%S).mp3"
          mv out.mp3 "/tmp/$FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin breton-audio 2>/dev/null; then
            git checkout -B breton-audio origin/breton-audio
          else
            git checkout --orphan breton-audio
            git rm -rqf .
          fi
          cp "/tmp/$FILE" "$FILE"
          git add "$FILE"
          git commit -qm "Breton audio: $FILE"
          git push -q origin breton-audio
          echo "SAVED https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/breton-audio/$FILE"
